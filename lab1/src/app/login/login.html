<form (ngSubmit)="login()"> 
 <mat-form-field appearance="fill">
    <input matInput placeholder="email" type="email" 
    [(ngModel)]="email">
  </mat-form-field>

   <mat-form-field appearance="fill">
    <input matInput placeholder="password" type="password" 
    [(ngModel)]="password">
  </mat-form-field>

  <button type="submit"> Submit</button>
</form>
